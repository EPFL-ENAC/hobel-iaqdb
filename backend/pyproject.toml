[project]
name = "iaqdb-api"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "ymarcon", email = "yannick.marcon@epfl.ch" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.4,<1.0.0",
    "faker>=26.0.0,<27.0.0",
    "rasterio>=1.3.10,<2.0.0",
    "pyproj>=3.6.1,<4.0.0",
    "requests>=2.32.3,<3.0.0",
    "sqlmodel>=0.0.22,<0.1.0",
    "alembic>=1.13.2,<2.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "psycopg2>=2.9.9,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "dynaconf>=3.2.6,<4.0.0",
    "pillow>=11.0.0,<12.0.0",
    "timezonefinder>=6.5.2,<7.0.0",
    "pandas>=2.2.2,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "country-converter>=1.2,<2.0",
    "python-multipart>=0.0.17,<0.1.0",
    "uvicorn>=0.32.0,<0.33.0",
    "enacit4r-auth",
    "enacit4r-files",
    "enacit4r-sql",
]

[dependency-groups]
dev = [
    "python-dotenv[cli]",
    "pre-commit",
]

[tool.uv]
package = false

[tool.uv.sources]
enacit4r-auth = { git = "https://github.com/EPFL-ENAC/enacit4r-auth", rev = "0.4.3" }
enacit4r-files = { git = "https://github.com/EPFL-ENAC/enacit4r-files", rev = "0.4.0" }
enacit4r-sql = { git = "https://github.com/EPFL-ENAC/enacit4r-sql", rev = "0.1.0" }
