services:
  reverse-proxy:
    image: traefik:v2.10
    networks:
      - iaqdb
    command:
      - "--accesslog=true"
      - "--providers.docker"
      - "--providers.file.directory=/configuration/"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  frontend:
    build:
      context: ./frontend
      args:
        - API_URL=${API_URL}
        - API_PATH=/api
    networks:
      - iaqdb
    expose:
      - 80
    ports:
      - '8080:80'
    labels:
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.middlewares=frontend-middleware"
      - "traefik.http.middlewares.frontend-middleware.stripprefix.prefixes=/"
    restart: unless-stopped
  backend:
    build: ./backend
    networks:
      - iaqdb
    environment:
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PREFIX=${DB_PREFIX}
      - API_KEYS=${API_KEYS}
      - PATH_PREFIX=/api
      - S3_ENDPOINT_HOSTNAME=${S3_ENDPOINT_HOSTNAME}
      - S3_ENDPOINT_PROTOCOL=${S3_ENDPOINT_PROTOCOL}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_PATH_PREFIX=${S3_PATH_PREFIX}
      - APP_URL=${APP_URL:-http://localhost}
      - DOWNLOAD_MAX_RECORDS=${DOWNLOAD_MAX_RECORDS:-200000000}
      - DOWNLOAD_MAX_CONCURRENT=${DOWNLOAD_MAX_CONCURRENT:-2}
      # the mailpit service below catches every email; not read from .env,
      # whose SMTP_HOST=localhost is for a backend run outside compose
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_STARTTLS=false
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply+iaqdb@epfl.ch}
    expose:
      - 8000
    ports:
      - '8000:8000'
    labels:
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.middlewares=backend-middleware"
      - "traefik.http.middlewares.backend-middleware.stripprefix.prefixes=/api"
    restart: "no"
    links:
      - postgres
      - mailpit
  postgres:
    image: timescale/timescaledb:latest-pg18
    networks:
      - iaqdb
    expose:
      - 5432
    ports:
      - '5432:5432'
    restart: "no"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_HOST=postgres
  # dev SMTP server: emails are caught, browse them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    networks:
      - iaqdb
    expose:
      - 1025
    ports:
      - '1025:1025'
      - '8025:8025'
    restart: "no"
volumes:
  postgres:
    driver: local
networks:
  iaqdb:
    name: iaqdb
